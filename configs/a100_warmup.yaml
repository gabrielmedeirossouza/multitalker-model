# Configuração Hydra/NeMo — Fase 1: Warm-up (Encoder Congelado) na GPU NVIDIA A100
name: "parakeet_ptbr_multitalker_warmup"

stage: "warmup"
pretrained_model: "nvidia/multitalker-parakeet-streaming-0.6b-v1"
freeze_encoder: true
# Spec 04 §5.6: preserva joint.enc/joint.pred/decoder LSTM pré-treinados na troca de vocabulário
reuse_vocab_independent_weights: true

model:
  sample_rate: 16000
  tokenizer:
    dir: "/content/drive/MyDrive/parakeet_ptbr/coraa_mupe/tokenizer_ptbr_1024"
    type: "bpe"
    vocab_size: 1024

  # Spec 04 §8.2: EncDecMultiTalkerRNNTBPEModel só cria dataloader via Lhotse (LhotseSpeechToTextSpkBpeDataset).
  train_ds:
    use_lhotse: true
    manifest_filepath: "/content/local_dataset/clean_train_manifest.json"
    text_field: "text"
    sample_rate: 16000
    batch_size: 32
    shuffle: true
    num_workers: 4
    pin_memory: true
    min_duration: 0.5
    max_duration: 20.0
    use_bucketing: true
    num_buckets: 8
    bucketing_strategy: "fully_randomized"
    return_speaker_targets: true
    num_speakers: 4
    num_sample_per_mel_frame: 160
    num_mel_frame_per_asr_frame: 8

  validation_ds:
    use_lhotse: true
    manifest_filepath: "/content/local_dataset/clean_val_manifest.json"
    text_field: "text"
    sample_rate: 16000
    batch_size: 16
    shuffle: false
    use_bucketing: false
    num_workers: 2
    return_speaker_targets: true
    num_speakers: 4
    num_sample_per_mel_frame: 160
    num_mel_frame_per_asr_frame: 8

  joint:
    fuse_loss_wer: true
    fused_batch_size: 16

  loss:
    loss_name: "warprnnt_numba"
    warprnnt_numba_kwargs:
      fastemit_lambda: 0.001

  optim:
    name: "adamw"
    lr: 1.0e-3
    betas: [0.9, 0.98]
    weight_decay: 1.0e-3
    sched:
      name: "CosineAnnealing"
      # Spec 04 §8.4: proporcional a trainer.max_steps (calculado pelo src/trainer.py a partir do manifesto)
      warmup_ratio: 0.1
      min_lr: 1.0e-5

trainer:
  devices: 1
  accelerator: "gpu"
  max_epochs: 30
  precision: "bf16-mixed"
  accumulate_grad_batches: 1
  gradient_clip_val: 1.0
  log_every_n_steps: 20
  val_check_interval: 1.0
  check_val_every_n_epoch: 5
  enable_checkpointing: false
  logger: false
  use_distributed_sampler: false

exp_manager:
  exp_dir: "/content/drive/MyDrive/parakeet_checkpoints/exp_coraa_mupe_warmup"
  name: "parakeet_ptbr_warmup"
  create_tensorboard_logger: true
  create_checkpoint_callback: true
  resume_if_exists: true
  resume_ignore_no_checkpoint: true
  checkpoint_callback_params:
    monitor: "val_wer"
    mode: "min"
    save_top_k: 1
    # Spec 04 §4: cada .ckpt/.nemo tem ~2,5 GB e arquivos rotacionados vão para a Lixeira do Drive (consomem cota)
    always_save_nemo: false
    save_best_model: true
